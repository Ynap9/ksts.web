server {
  listen 80;

  root /usr/share/nginx/html/sakai-ng/browser;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # nginx chưa map đuôi .mjs nên trả về application/octet-stream, mà Chrome từ chối chạy module worker với
  # MIME không phải JavaScript - worker của pdf.js chết lặng và ô xem trước PDF trắng trơn.
  location ~* \.mjs$ {
    default_type application/javascript;
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  # Cache static assets
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }
}
