server {
  listen 80;

  root /usr/share/nginx/html/sakai-ng/browser;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # nginx chưa map đuôi .mjs nên trả về application/octet-stream, mà trình duyệt từ chối chạy module script
  # với MIME không phải JavaScript. Phải là types chứ không phải default_type: default_type chỉ đỡ khi bảng
  # mime.types không có đuôi đó, còn types thì ghi đè hẳn. Bản build hiện KHÔNG còn file .mjs nào (worker
  # pdf.js đã phát dưới đuôi .js) - giữ khối này làm lưới an toàn, đừng bỏ.
  location ~* \.mjs$ {
    types { text/javascript mjs; }
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  # Cache static assets
  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }
}
